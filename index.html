<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2a0510;--bg2:#08010a;--ink:#fbeaea;--gold:#e8c27a;--ruby:#d3123a;--soft:#f3b9c4}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 35%,var(--bg1),var(--bg2) 70%);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;overflow:hidden;
 padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:6px}
.ring{width:min(62vw,280px);opacity:0;transform:scale(.6) translateY(30px);transition:opacity 1.8s ease,transform 1.8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 30px rgba(211,18,58,.55))}
.ring.show{opacity:1;transform:none}
.ring.show .glint{animation:glint 3.2s ease-in-out infinite}
@keyframes glint{0%,60%{opacity:0}75%{opacity:1}100%{opacity:0}}
h1{font-weight:400;font-style:italic;font-size:clamp(1.5rem,5.5vw,2.4rem);margin:0;min-height:1.3em;letter-spacing:.01em;line-height:1.25}
h2{font-weight:600;font-size:clamp(2rem,8vw,3.6rem);margin:6px 0 0;line-height:1.1;color:#fff;text-shadow:0 0 24px rgba(211,18,58,.7);opacity:0;transition:opacity 1.5s}
h2.show{opacity:1}
.btns{display:flex;gap:18px;margin-top:22px;opacity:0;pointer-events:none;transition:opacity 1s;min-height:56px;align-items:center}
.btns.show{opacity:1;pointer-events:auto}
button{font:600 1.3rem "Cormorant Garamond",Georgia,serif;border:0;border-radius:40px;padding:12px 34px;cursor:pointer;touch-action:manipulation}
#yes{background:linear-gradient(135deg,#f0476b,var(--ruby));color:#fff;box-shadow:0 0 26px rgba(211,18,58,.7);transition:transform .3s}
#yes:hover,#yes:focus-visible{transform:scale(1.08)}
#no{background:transparent;color:var(--soft);border:1px solid var(--soft)}
#no.run{position:fixed;z-index:5;transition:left .25s,top .25s}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.done{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;opacity:0;pointer-events:none;transition:opacity 1.5s;gap:10px;background:radial-gradient(ellipse at center,rgba(8,1,10,.55),transparent 75%)}
.done.show{opacity:1}
.done h3{font-size:clamp(2.2rem,9vw,4.4rem);font-weight:600;margin:0;color:#fff;text-shadow:0 0 30px var(--ruby)}
.done p{font-size:clamp(1.2rem,4.5vw,1.8rem);font-style:italic;margin:0;color:var(--soft)}
@media (prefers-reduced-motion:reduce){.ring,h2,.btns,.done{transition:none}.glint{animation:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main id="stage">
  <svg class="ring" id="ring" viewBox="0 0 200 200" role="img" aria-label="A gold ring with a ruby">
    <defs>
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1c4"/><stop offset=".45" stop-color="#e8c27a"/><stop offset="1" stop-color="#a87a2a"/></linearGradient>
      <linearGradient id="r1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b8b"/><stop offset="1" stop-color="#b00a2f"/></linearGradient>
      <linearGradient id="r2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0153f"/><stop offset="1" stop-color="#5e0518"/></linearGradient>
    </defs>
    <circle cx="100" cy="142" r="48" fill="none" stroke="url(#gold)" stroke-width="11"/>
    <circle cx="100" cy="142" r="48" fill="none" stroke="#fff6d8" stroke-opacity=".35" stroke-width="2" stroke-dasharray="40 260" stroke-dashoffset="-30"/>
    <path d="M82 92 L92 78 M118 92 L108 78" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <polygon points="78,36 122,36 142,56 100,104 58,56" fill="url(#r2)"/>
    <polygon points="78,36 122,36 112,56 88,56" fill="#ff8aa3"/>
    <polygon points="78,36 88,56 58,56" fill="url(#r1)"/>
    <polygon points="122,36 142,56 112,56" fill="#c20f38"/>
    <polygon points="58,56 88,56 100,104" fill="#e8184a"/>
    <polygon points="88,56 112,56 100,104" fill="#9c0828"/>
    <polygon points="112,56 142,56 100,104" fill="#7a0620"/>
    <polygon points="78,36 122,36 142,56 100,104 58,56" fill="none" stroke="#ffd3dc" stroke-opacity=".6" stroke-width="1"/>
    <g class="glint" opacity="0" fill="#fff"><path d="M92 44 L95 38 L98 44 L104 47 L98 50 L95 56 L92 50 L86 47Z"/><circle cx="130" cy="52" r="2.2"/></g>
  </svg>
  <h1 id="line"></h1>
  <h2 id="q">Will you marry me?</h2>
  <div class="btns" id="btns"><button id="yes">Yes</button><button id="no">No</button></div>
</main>
<div class="done" id="done"><h3>She said yes!</h3><p>I love you. Forever starts now.</p></div>

<script>
// Edit these two lines to make it yours:
const HER_NAME = "";            // e.g. "Priya"
const SIGNED = "";              // e.g. "Forever yours, Rahul"

const $ = id => document.getElementById(id);
const line = $("line"), q = $("q"), btns = $("btns"), ring = $("ring"), done = $("done");
const cv = $("fx"), ctx = cv.getContext("2d");
let W, H, dpr;
function size(){ dpr = Math.min(devicePixelRatio||1,2); W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener("resize", size); size();

// Ambient floating sparkles
const motes = Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.4,v:Math.random()*.3+.1,p:Math.random()*6}));
// Fireworks
let rockets = [], sparks = [], celebrating = false, t0 = performance.now();

function launch(){
  const x = W*(.15+Math.random()*.7);
  rockets.push({x, y:H, vx:(Math.random()-.5)*1.2, vy:-(H*.016+Math.random()*4), ty:H*(.15+Math.random()*.35), hue:[350,340,45,0,15][Math.random()*5|0]});
}
function burst(x,y,hue){
  const n = 70+Math.random()*40|0, heart = Math.random()<.3;
  for(let i=0;i<n;i++){
    const a = i/n*Math.PI*2, s = 2+Math.random()*3.2;
    let vx = Math.cos(a)*s, vy = Math.sin(a)*s;
    if(heart){ const u=a; vx = 16*Math.pow(Math.sin(u),3)*.2; vy = -(13*Math.cos(u)-5*Math.cos(2*u)-2*Math.cos(3*u)-Math.cos(4*u))*.2; }
    sparks.push({x,y,vx,vy,life:1,d:.008+Math.random()*.012,hue:hue+(Math.random()*20-10),size:Math.random()*1.8+1});
  }
}
function frame(now){
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "rgba(8,1,10,.0)"; ctx.clearRect(0,0,W,H);
  // motes
  for(const m of motes){
    m.y -= m.v; if(m.y<-5){ m.y = H+5; m.x = Math.random()*W; }
    const a = .25+.25*Math.sin(now/700+m.p);
    ctx.fillStyle = `rgba(255,190,200,${a})`; ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,6.3); ctx.fill();
  }
  ctx.globalCompositeOperation = "lighter";
  for(const r of rockets){
    r.x += r.vx; r.y += r.vy; r.vy *= .985;
    ctx.fillStyle = `hsl(${r.hue},100%,75%)`; ctx.beginPath(); ctx.arc(r.x,r.y,2.2,0,6.3); ctx.fill();
    if(r.y <= r.ty || r.vy > -1.2){ r.dead = true; burst(r.x,r.y,r.hue); }
  }
  rockets = rockets.filter(r=>!r.dead);
  for(const s of sparks){
    s.x += s.vx; s.y += s.vy; s.vy += .045; s.vx *= .985; s.life -= s.d;
    ctx.fillStyle = `hsla(${s.hue},100%,${55+s.life*20}%,${Math.max(s.life,0)})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.size*s.life+.3,0,6.3); ctx.fill();
  }
  sparks = sparks.filter(s=>s.life>0);
  if(celebrating && Math.random()<.07) launch();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Intro sequence (one orchestrated moment)
const wait = ms => new Promise(r=>setTimeout(r,ms));
async function type(text){
  line.textContent = "";
  for(const ch of text){ line.textContent += ch; await wait(55); }
}
(async()=>{
  await wait(600);
  await type(HER_NAME ? `${HER_NAME}, I made something for you…` : "I made something for you…");
  await wait(900);
  ring.classList.add("show");
  await wait(2400);
  line.style.transition = "opacity .8s"; line.style.opacity = 0;
  await wait(800);
  q.classList.add("show");
  await wait(1000);
  btns.classList.add("show");
})();

// The "No" button politely dodges
const no = $("no");
function dodge(e){
  if(e) e.preventDefault();
  if(!no.classList.contains("run")){
    const b = no.getBoundingClientRect();
    no.style.left = b.left+"px"; no.style.top = b.top+"px"; no.classList.add("run");
  }
  const bw = no.offsetWidth, bh = no.offsetHeight;
  requestAnimationFrame(()=>{
    no.style.left = (20+Math.random()*(W-bw-40))+"px";
    no.style.top = (20+Math.random()*(H-bh-40))+"px";
  });
  const y = $("yes"); y.style.transform = `scale(${Math.min(1+(dodge.n=(dodge.n||0)+1)*.12,2)})`;
}
no.addEventListener("pointerenter", dodge);
no.addEventListener("pointerdown", dodge);
no.addEventListener("click", dodge);
no.addEventListener("focus", dodge);

// She said yes
$("yes").addEventListener("click", ()=>{
  $("stage").style.transition = "opacity 1s"; $("stage").style.opacity = .12;
  no.style.display = "none";
  if(SIGNED) done.querySelector("p").textContent += " " + SIGNED;
  done.classList.add("show");
  celebrating = true;
  for(let i=0;i<6;i++) setTimeout(launch, i*250);
  try{ navigator.vibrate && navigator.vibrate([80,60,80]); }catch(e){}
});
</script>
</body>
</html>
